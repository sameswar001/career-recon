[project]
name = "career-recon"
version = "0.1.0"
description = "A LangGraph agent that researches your next interview, fact-checks itself, and won't publish without your sign-off."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "tavily-python>=0.7.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph", "nodes", "tools","core"]
