[project]
name = "career-recon"
version = "0.1.0"
description = "A LangGraph agent that researches your next interview, fact-checks itself, and won't publish without your sign-off."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph", "nodes", "tools"]
